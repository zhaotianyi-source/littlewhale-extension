<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --primary: #4d6bfe;
      --primary-hover: #3d5af0;
      --green: #0fbfa0;
      --green-hover: #0ca98e;
      --text: #1f2329;
      --muted: #8a919f;
      --border: #e3e6eb;
      --bg: #fafbfc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: linear-gradient(120deg, #4d6bfe, #0fbfa0);
      color: #fff;
    }
    .header img { width: 24px; height: 24px; border-radius: 6px; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.85; }
    .section { padding: 12px 14px; border-bottom: 1px solid #f0f1f3; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: none;
    }
    .section-title::before {
      content: '';
      width: 3px; height: 12px;
      border-radius: 2px;
      background: var(--primary);
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--primary); }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      transition: background 0.15s, transform 0.05s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: scale(0.97); }
    .btn.green { background: var(--green); }
    .btn.green:hover { background: var(--green-hover); }
    .btn.ghost {
      background: #f2f3f5;
      color: var(--text);
    }
    .btn.ghost:hover { background: #e4e6eb; }
    .btn.small { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { font-size: 12px; margin-top: 6px; min-height: 16px; }
    .status.ok { color: var(--green); }
    .status.err { color: #d64545; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
    .hint code {
      background: #f2f3f5;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 11px;
      word-break: break-all;
    }
    .help { padding: 10px 14px; }
    .help ul { padding-left: 16px; }
    .help li { font-size: 12px; color: var(--muted); line-height: 1.8; }
    .footer { padding: 10px 14px; text-align: center; color: #b6bcc7; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="logo" />
    <div>
      <h1>小鲸鱼助手 LittleWhale</h1>
      <p>选中文本 → DeepSeek 翻译 / 解读</p>
    </div>
  </div>

  <!-- ① DeepSeek 配置 -->
  <div class="section">
    <div class="section-title">DeepSeek API 配置</div>
    <label for="apiKey">API Key（粘贴后自动保存，存储在本机浏览器中）</label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
      <button class="btn ghost small" id="toggleKey">显示</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn small" id="saveKey">立即保存</button>
      <button class="btn green small" id="testKey">测试连接</button>
    </div>
    <label style="margin-top:8px; display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text);">
      <input type="checkbox" id="safeMode" />
      <span>安全模式：Key 仅保存在内存，不写入磁盘（重启浏览器后需重新输入）</span>
    </label>
    <div class="status" id="keyStatus"></div>
    <div class="hint">
      在 <code>platform.deepseek.com</code> 创建 API Key。保存后可关闭本弹窗，直接在网页里选中文字使用。
    </div>
  </div>

  <!-- ② 模型设置 -->
  <div class="section">
    <div class="section-title">模型设置</div>
    <label for="model">模型</label>
    <input type="text" id="model" list="modelList" />
    <datalist id="modelList">
      <option value="deepseek-v4-flash"></option>
      <option value="deepseek-v4-pro"></option>
      <option value="deepseek-chat"></option>
      <option value="deepseek-reasoner"></option>
    </datalist>
    <label for="effort" style="margin-top:8px;">智能水平（思考强度）</label>
    <select id="effort" style="width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; outline:none;">
      <option value="max">Max（最强推理，最慢）</option>
      <option value="high">High（较高，更快）</option>
      <option value="low">Low（低，最快）</option>
    </select>
    <div class="status" id="modelStatus"></div>
    <div class="hint">
      v4 系列模型思考模式默认开启；「智能水平」对应 <code>reasoning_effort</code> 参数，修改后自动保存。
    </div>
  </div>

  <div class="help">
    <ul>
      <li>在任意网页选中文字，即可弹出「翻译 / 解读」按钮</li>
      <li>API Key 仅保存在本机，不会上传到其它服务器</li>
    </ul>
  </div>

  <div class="footer">小鲸鱼助手 LittleWhale v1.2.0</div>

  <script src="popup.js"></script>
</body>
</html>
